<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aplikasi penghitung setoran</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <h1>Aplikasi Penghitung Setoran</h1>
      <p>App version : 1.0 - Made with &#128140 by : MUHAMAD YUSUP FAJARUDIN</p>
    </header>

    <section class="pendapatan-shift">
      <h2>Pendapatan Shift dan Voucher</h2>
      <div class="shift1Pk1">
        <label for="shift1Pk1">Pendapatan Shift 1 - PK 1 : </label>
        <input type="number" id="shift1Pk1" />
      </div>

      <div class="shift1Pk4">
        <label for="shift1Pk4">Pendapatan Shift 1 - PK4 : </label>
        <input type="number" id="shift1Pk4" />
      </div>

      <div class="shift2Pk1">
        <label for="shift2Pk1">Pendapatan Shift 2 - PK 1 : </label>
        <input type="number" id="shift2Pk1" />
      </div>

    <div class="shift2Pk4">
        <label for="shift2Pk4">Pendapatan Shift 2 - PK 4 : </label>
        <input type="number" id="shift2Pk4" />
      </div>


      <div class="shift3Pk1">
        <label for="shift3Pk1">Pendapatan Shift 3 - PK 1 : </label>
        <input type="number" id="shift3Pk1" />
      </div>


       <div class="shift3Pk4">
        <label for="shift3Pk4">Pendapatan Shift 3 - PK 4 : </label>
        <input type="number" id="shift3Pk4" />
      </div> 

      <button id="btnJumlahkanPendapatanShift">
        Jumlahkan Pendapatan Shift
      </button>

      <div id="hasilPendapatanShift">
        Jumlah Pendapatan Shift = <span id="hasilJumlahPendapatanShift"></span>
      </div>
    </section>

    <section class="setoran">
      <h2>Setoran</h2>
      <div>
        <label for="totalSetoran">Total Setoran : </label>
        <input type="number" id="totalSetoran" />
      </div>

      <button id="btnHitungSelisih">Hitung Selisih</button>

      <div class="hasilSelisih"></div>
      <button id="btnReset">Reset Semua</button>
    </section>

    <script src="script.js"></script>
  </body>
</html>
